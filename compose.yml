services:
  postgres:
    image: postgres:latest
    container_name: psgr
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-12345}
      - POSTGRES_DB=${DB_NAME:-studnet}
    volumes:
      - postgres-data:/var/lib/postgresql/studnet
    ports:
      - "5432:5432"
    networks:
      - stud_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studnet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "127.0.0.1:8080:8080"
    links:
      - "postgres:db"
    networks:
      - stud_net
    depends_on:
      - postgres
      
  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    networks:
      - stud_net

  minio:
    image: minio/minio:latest
    container_name: minio_container
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    networks:
      - stud_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: studnet_backend
    container_name: backend_container
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - stud_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - S3_URL=${S3_URL}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - DISABLE_EMAIL=${DISABLE_EMAIL:-false}
      - VERIFICATION_CODE_EXPIRE_MINUTES=${VERIFICATION_CODE_EXPIRE_MINUTES}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_SECRET=${GITHUB_APP_SECRET}
      - S3_AVATARS_BUCKET=${S3_AVATARS_BUCKET}
      - S3_PROJECT_FILES_BUCKET=${S3_PROJECT_FILES_BUCKET}
      - S3_MEDIA_BUCKET=${S3_MEDIA_BUCKET}
      - S3_ANNOUNCEMENT_BUCKET=${S3_ANNOUNCEMENT_BUCKET}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://45.11.92.114:8000
        - VITE_WS_URL=ws://45.11.92.114:8000
    container_name: frontend_container
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - stud_net
    depends_on:
      - backend

networks:
  stud_net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
