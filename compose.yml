services:
  postgres:
    image: postgres:latest
    container_name: psgr
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-12345}
      - POSTGRES_DB=${DB_NAME:-studnet}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - stud_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-studnet}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    links:
      - "postgres:db"
    networks:
      - stud_net
    depends_on:
      - postgres
      
  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    networks:
      - stud_net

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio_container
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_KEY:-minioadmin}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    networks:
      - stud_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: studnet_backend
    container_name: backend_container
    ports:
      - "8000:8000"
    networks:
      - stud_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-12345}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-studnet}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - S3_URL=${S3_URL:-http://minio:9000}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://136.234.4.160:9100}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-minioadmin}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-studnet_jwt_secret_key_136_234_4_160}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - DISABLE_EMAIL=${DISABLE_EMAIL:-true}
      - VERIFICATION_CODE_EXPIRE_MINUTES=${VERIFICATION_CODE_EXPIRE_MINUTES:-15}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_SECRET=${GITHUB_APP_SECRET:-}
      - S3_AVATARS_BUCKET=${S3_AVATARS_BUCKET:-avatars}
      - S3_PROJECT_FILES_BUCKET=${S3_PROJECT_FILES_BUCKET:-project-files}
      - S3_MEDIA_BUCKET=${S3_MEDIA_BUCKET:-media-bucket}
      - S3_ANNOUNCEMENT_BUCKET=${S3_ANNOUNCEMENT_BUCKET:-announcement-bucket}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://136.234.4.160:8000}
        - VITE_WS_URL=${VITE_WS_URL:-ws://136.234.4.160:8000}
        - VITE_S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://136.234.4.160:9100}
    container_name: frontend_container
    ports:
      - "3000:80"
    networks:
      - stud_net
    depends_on:
      - backend

networks:
  stud_net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
